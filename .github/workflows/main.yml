name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build all platforms
        run: |
          set -e
          mkdir -p dist
          build() {
            local os=$1 arch=$2 ext=$3
            local out="dist/MatchStar-${os}-${arch}${ext}"
            echo "-> $out"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "$out" MatchStar.go
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build linux   arm   ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"
          ls -la dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MatchStar ${{ github.ref_name }}
          body: |
            ## MatchStar ${{ github.ref_name }}

            Multi-Engine Analysis Language (MEAL)

            ### Assets

            | Platform | File |
            |----------|------|
            | Linux amd64   | `MatchStar-linux-amd64` |
            | Linux arm64   | `MatchStar-linux-arm64` |
            | Linux arm     | `MatchStar-linux-arm` |
            | macOS amd64   | `MatchStar-darwin-amd64` |
            | macOS arm64   | `MatchStar-darwin-arm64` |
            | Windows amd64 | `MatchStar-windows-amd64.exe` |
            | Windows arm64 | `MatchStar-windows-arm64.exe` |

            ### Verify

            ```bash
            sha256sum -c checksums.txt
            ```
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}