name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test (${{ matrix.os }} / go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', '1.25', '1.26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Build
        shell: bash
        run: |
          go build -o starlang starlang.go
          ls -la starlang* || true

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Demo
        shell: bash
        run: ./starlang -demo || ./starlang.exe -demo

      - name: Version
        shell: bash
        run: ./starlang -v || ./starlang.exe -v

      - name: Help
        shell: bash
        run: ./starlang -help || ./starlang.exe -help

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...